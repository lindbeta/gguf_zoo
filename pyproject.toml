[project]
name = "gguf-zoo"
version = "2.0.0"
description = "GGUF metadata -> deterministic fictional creature field guide"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.7",
]

[project.scripts]
gguf-zoo = "gguf_zoo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gguf_zoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req: FR requirement id covered by this test",
]
